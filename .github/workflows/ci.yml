name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astrale-os/config/.github/actions/setup@d48f4f718c07eb4c43afc71b58003df3d9979313
        with:
          frozen-lockfile: 'true'
      - name: Typecheck public and extension surfaces
        run: pnpm typecheck
      - name: Validate governed architecture and negative scans
        run: pnpm check
      - name: Run the complete package suite
        run: pnpm test
