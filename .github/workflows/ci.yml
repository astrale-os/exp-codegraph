name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: 'false'
      - uses: astrale-os/config/.github/actions/setup@9bffee57d53b603b556bb545145fdde10f20a4c5
        with:
          frozen-lockfile: 'true'
      - name: Prove registry publication is disabled
        run: pnpm artifact:policy
      - name: Typecheck public and extension surfaces
        run: pnpm typecheck
      - name: Validate governed architecture and negative scans
        run: pnpm check
      - name: Run the complete package suite
        run: pnpm test
