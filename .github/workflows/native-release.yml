name: Native artifact qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-release.yml'
      - '__tests__/native-distribution.test.ts'
      - '__tests__/native-package-admission.test.ts'
      - '__tests__/npm-distribution-policy.test.ts'
      - '__tests__/typescript-project.test.ts'
      - 'analysis/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'native-artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'qualification/v2/extension/**'
      - 'qualification/v2/release/**'
      - 'qualification/v2/ttsc/fixtures/**'
      - 'scripts/native/**'
  pull_request:
    paths:
      - '.github/workflows/native-release.yml'
      - '__tests__/native-distribution.test.ts'
      - '__tests__/native-package-admission.test.ts'
      - '__tests__/npm-distribution-policy.test.ts'
      - '__tests__/typescript-project.test.ts'
      - 'analysis/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'native-artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'qualification/v2/extension/**'
      - 'qualification/v2/release/**'
      - 'qualification/v2/ttsc/fixtures/**'
      - 'scripts/native/**'

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and qualify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            oxlint: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            oxlint: false
          - target: darwin-x64
            runner: macos-15-intel
            oxlint: false
          - target: darwin-arm64
            runner: macos-15
            oxlint: true
          - target: win32-x64
            runner: windows-latest
            oxlint: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: 'false'
      - uses: astrale-os/config/.github/actions/setup@9bffee57d53b603b556bb545145fdde10f20a4c5
        with:
          frozen-lockfile: 'true'
      - name: Prepare the pinned Rust toolchain
        if: matrix.oxlint
        run: node scripts/native/build-oxlint.mjs --prepare-toolchain
      - name: Build exact native artifact
        run: pnpm native:build -- --target ${{ matrix.target }} --output .native-output/${{ matrix.target }}
      - name: Build package distribution
        run: pnpm build
      - name: Check the frozen Darwin ARM64 oracle and complete native regression suite
        if: matrix.target == 'darwin-arm64'
        run: pnpm native:test
      - name: Qualify captured-source compiler paths on this host
        run: pnpm native:test -- --files-json '["."]' --options-json '["-run=TestGovernanceCompilerPaths"]'
      - name: Qualify the actual built Oxlint worker lifetime and captured I/O
        if: matrix.oxlint
        run: pnpm native:test -- --files-json '["."]' --options-json '["-run=TestOwned|TestPolicyLaneOwned"]' --owned-artifact .native-output/${{ matrix.target }}/bin/codegraph-oxlint
      - name: Qualify native semantics and extension boundary
        run: node qualification/v2/extension/qualify.ts --native-binary .native-output/${{ matrix.target }}/bin/codegraph-native${{ matrix.target == 'win32-x64' && '.exe' || '' }}
      - name: Qualify native regression and diagnostic transport
        run: pnpm exec vitest run __tests__/native-identity.test.ts __tests__/native-semantic-body.test.ts __tests__/typescript-normalized-facts.test.ts __tests__/typescript-value-semantics.test.ts __tests__/typescript-symbolic-values.test.ts __tests__/typescript-project.test.ts __tests__/typescript-structural-inspection.test.ts __tests__/typescript-structural-navigation.test.ts __tests__/typescript-structural-compute.test.ts __tests__/native-distribution.test.ts --maxWorkers 1
        env:
          CODEGRAPH_TEST_NATIVE_BINARY: .native-output/${{ matrix.target }}/bin/codegraph-native${{ matrix.target == 'win32-x64' && '.exe' || '' }}
      - name: Upload qualified native artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: .native-output/${{ matrix.target }}
          if-no-files-found: error

  assemble:
    name: Assemble the exact release manifest and package
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: 'false'
      - uses: astrale-os/config/.github/actions/setup@9bffee57d53b603b556bb545145fdde10f20a4c5
        with:
          frozen-lockfile: 'true'
      - name: Download every native target
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-*'
          path: .native-input
      - name: Assemble and validate distributable artifacts
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: pnpm native:assemble -- --input .native-input && pnpm native:assert-release -- --source-revision "$SOURCE_REVISION" && pnpm build
      - name: Pack GitHub consumer artifact
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
      - name: Upload assembled GitHub artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codegraph-release
          path: release/*.tgz
          if-no-files-found: error

  packed-consumer:
    name: Install and execute the ${{ matrix.target }} package (Node ${{ matrix.node-version }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            node-version: '26'
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            node-version: '26'
          - target: darwin-x64
            runner: macos-15-intel
            node-version: '26'
          - target: darwin-arm64
            runner: macos-15
            node-version: '26'
          - target: win32-x64
            runner: windows-latest
            node-version: '26'
          - target: linux-x64
            runner: ubuntu-24.04
            node-version: '22.13.0'
          - target: linux-x64
            runner: ubuntu-24.04
            node-version: '22'
          - target: linux-x64
            runner: ubuntu-24.04
            node-version: '24'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: 'false'
      - uses: astrale-os/config/.github/actions/setup@9bffee57d53b603b556bb545145fdde10f20a4c5
        with:
          frozen-lockfile: 'true'
          node-version: '26'
      - name: Download assembled GitHub artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codegraph-release
          path: release
      - name: Select the packed consumer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7, same pin as Config setup
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Prove GitHub artifact installation and native execution
        run: node qualification/v2/release/packed-consumer.mjs --release-directory release ${{ (matrix.target == 'darwin-arm64' || matrix.target == 'linux-x64') && '--require-oxlint' || '' }}
      - name: Qualify SQLite on the minimum supported Node release
        if: matrix.node-version == '22.13.0'
        run: node node_modules/vitest/vitest.mjs run __tests__/analysis-v2.test.ts -t 'SQLite|memory and SQLite|telemetry' --maxWorkers 1
